<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f4c81"><title>Latihan Soal AMT Airframe: Communication &amp; Navigation</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--tx:#18222f;--mu:#5b6a7d;--pr:#0f4c81;--prt:#fff;--bd:#d8dfe9;--ok:#1b8a4b;--okb:#e2f5ea;--no:#c62f2f;--nob:#fde8e8;--ne:#8a6d00;--neb:#fff6d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d141c;--card:#17212b;--tx:#e7edf4;--mu:#97a6b8;--pr:#5aa2e6;--prt:#0b1520;--bd:#2b3745;--ok:#4cc383;--okb:#12301f;--no:#ff7b7b;--nob:#3a1a1a;--ne:#e8c75a;--neb:#33290b}}
:root[data-theme="dark"]{--bg:#0d141c;--card:#17212b;--tx:#e7edf4;--mu:#97a6b8;--pr:#5aa2e6;--prt:#0b1520;--bd:#2b3745;--ok:#4cc383;--okb:#12301f;--no:#ff7b7b;--nob:#3a1a1a;--ne:#e8c75a;--neb:#33290b}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:15px;margin:16px 0 8px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.03em}h2:first-child{margin-top:0}
.mu{color:var(--mu);font-size:14px}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{border-color:var(--pr);background:var(--pr);color:var(--prt);font-weight:600}.chip small{opacity:.75}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--pr);color:var(--prt);font:inherit;font-weight:600;cursor:pointer;margin-top:10px}
.btn.sec{background:transparent;color:var(--pr);border:1.5px solid var(--pr)}.btn:disabled{opacity:.4}
input[type=search]{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
details summary{cursor:pointer;color:var(--pr);font-size:14px;margin-top:10px}
.pk{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:14px}
.cnt{font-weight:700;color:var(--pr)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--mu)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:8px 0 12px}.bar i{display:block;height:100%;background:var(--pr)}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:9px;background:var(--bd);color:var(--mu);margin:0 4px 6px 0}
.q{font-size:18px;font-weight:600;margin:2px 0 12px;white-space:pre-wrap}
.fig{background:#fff;border-radius:10px;padding:6px;margin:8px 0;text-align:center}.fig img{max-width:100%;height:auto;display:block;margin:0 auto}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:12px;margin:8px 0;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;cursor:pointer}
.opt b{flex:0 0 26px;height:26px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:13px}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.ok b{background:var(--ok);color:#fff}
.opt.no{border-color:var(--no);background:var(--nob)}.opt.no b{background:var(--no);color:#fff}
.opt.ne{border-color:var(--ne);background:var(--neb)}.opt .fig{margin:0;padding:3px}
.note{font-size:14px;padding:10px 12px;border-radius:10px;background:var(--neb);color:var(--ne);margin-top:8px}
.nav{display:flex;gap:8px;margin-top:10px}.nav .btn{margin:0;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px}
.g{aspect-ratio:1;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font:inherit;font-size:14px;cursor:pointer;padding:0}
.g.ok{background:var(--ok);border-color:var(--ok);color:#fff}.g.no{background:var(--no);border-color:var(--no);color:#fff}.g.ne{background:var(--ne);border-color:var(--ne);color:var(--bg)}
.g.cur{outline:3px solid var(--pr);outline-offset:1px}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mu);margin-bottom:8px}.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;background:var(--bd)}
.score{font-size:46px;font-weight:700;text-align:center}.stat{display:flex;justify-content:center;gap:16px;font-size:14px;margin:4px 0 8px}
.rev{border-top:1px solid var(--bd);padding:12px 0;font-size:15px}.rev:first-of-type{border-top:0}
.hero{background:#fff;border-radius:14px;padding:6px 10px;margin:4px 0 12px;border:1px solid var(--bd)}.hero img{width:100%;max-height:200px;object-fit:contain;display:block;margin:0 auto}
.ex{margin-top:12px;padding:12px;border-radius:12px;background:var(--okb);border:1px solid var(--ok);font-size:15px}.ex p{margin:6px 0}.ex .mu{margin-top:8px}.ex .fig{margin:6px 0}
.tag.mk{background:#ffe66b;color:#4a3d00}.chip.yl.on{background:#ffe66b;border-color:#d4b700;color:#3d3200}input[type=text]{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit}
</style></head><body><main id="app"></main>
<script>
const D={"bank": [{"id": "CN-8647", "s": "Communication & Navigation", "num": "8647", "n": 1, "c": "Autopilot", "q": "What is the primary purpose of an autopilot?", "o": ["To relieve the pilot of control of the aircraft during long periods of flight.", "To fly a more precise course for the pilot.", "To obtain the navigational aid necessary for extended overwater flights."], "a": 0, "e": "The primary purpose of an automatic pilot is to relieve the human pilot of having to manually control the aircraft at all times.", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8648", "s": "Communication & Navigation", "num": "8648", "n": 2, "c": "Autopilot", "q": "Which of the following provides manual maneuverability of the aircraft while the autopilot is engaged?", "o": ["Servo-amplifier.", "Directional gyro indicator.", "Flight controller."], "a": 2, "e": "The flight controller allows the pilot to provide manual maneuverability to the aircraft when the autopilot is engaged.\nThe pilot can insert a command signal through the controller at any time.", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8649", "s": "Communication & Navigation", "num": "8649", "n": 3, "c": "Autopilot", "q": "In an autopilot, which signal nullifies the input signal to the ailerons?", "o": ["Displacement signal.", "Course signal.", "Followup signal."], "a": 2, "e": "The follow-up signal in an autopilot nulls out the input signals to the control surfaces when the correct amount of deflection is reached.", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8650", "s": "Communication & Navigation", "num": "8650", "n": 4, "c": "Autopilot", "q": "In which control element of an autopilot system is an attitude indicator?", "o": ["Command.", "Sensing.", "Input."], "a": 1, "e": "The attitude indicator, which senses deviation from a level-flight attitude, is in the sensing system of an autopilot.", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8651", "s": "Communication & Navigation", "num": "8651", "n": 5, "c": "Autopilot", "q": "What is the operating principle of the sensing device used in an autopilot system?", "o": ["The reaction of the force 90° away from the applied force in the direction of gyro rotation.", "The relative motion between a gyro and its supporting system.", "The rate of change of motion between the gyro gimbal rings and the aircraft."], "a": 1, "e": "The gyro in a flight instrument remains rigid in space and the aircraft rotates about it.\nThe gyro is used as the reference device in an autopilot which senses the relative motion between the gyro and its supporting system.", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8652", "s": "Communication & Navigation", "num": "8652", "n": 6, "c": "Autopilot", "q": "What will occur if an aircraft attitude is changed by its autopilot system in order to correct for an error and the involved control surfaces are returned to streamline by the time the aircraft has reached its correct position?", "o": ["Overshoot and oscillation.", "Undershoot and oscillation.", "Normal operation."], "a": 2, "e": "A displacement follow-up in an autopilot system develops a signal proportional to the amount of error sensed. It stops the control surface movement as soon as sufficient displacement has been reached.\nIf the left wing drops, the gyro senses an error and sends a signal to the aileron servo that moves the left aileron down. When the aileron moves an amount proportional to the amount the wing has dropped, the followup system generates a signal equal in amplitude but opposite in polarity to the error signal and cancels it.\nThe left wing is still down and the aileron is deflected. Since the signals have canceled, the autopilot does not call for any more aileron deflection. As the aerodynamic forces bring the wing back to level flight attitude, an error signal opposite to the one that started the action is produced. This signal is gradually canceled. By the time the wing comes level, the aileron is in the streamlined position and there is no overshooting or oscillation.", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8653", "s": "Communication & Navigation", "num": "8653", "n": 7, "c": "Autopilot", "q": "What component of an autopilot system applies torque to the control surfaces of an aircraft?", "o": ["Servo.", "Controller.", "Gyro."], "a": 0, "e": "The servo is the component in an autopilot system that applies the force to actuate the control surface.", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8654", "s": "Communication & Navigation", "num": "8654", "n": 8, "c": "Autopilot", "q": "What is the main purpose of a servo in an autopilot system?", "o": ["Correct for displacement of the aircraft about its axis.", "Change mechanical energy to electrical energy.", "Move the control surface as commanded."], "a": 2, "e": "The servo in an autopilot system moves the control surface as commanded by the control units.", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8655", "s": "Communication & Navigation", "num": "8655", "n": 9, "c": "Autopilot", "q": "Which channel of an autopilot detects changes in pitch attitude of an aircraft?", "o": ["Elevator.", "Aileron.", "Rudder."], "a": 0, "e": "The autopilot detects changes in pitch attitude in the elevator control channel.", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8656", "s": "Communication & Navigation", "num": "8656", "n": 10, "c": "Autopilot", "q": "The elevator channel of an autopilot controls the aircraft about which axis of rotation?", "o": ["Roll.", "Longitudinal.", "Lateral."], "a": 2, "e": "The elevator channel of an autopilot controls the aircraft about its pitch axis (its lateral axis).", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8657", "s": "Communication & Navigation", "num": "8657", "n": 11, "c": "Autopilot", "q": "What component is the sensing device in an electromechanical autopilot system?", "o": ["Servo.", "Gyro.", "Controller."], "a": 1, "e": "Most electromechanical and electronic autopilots use gyros to sense movement of an aircraft about its pitch, roll, and yaw axes.", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8658", "s": "Communication & Navigation", "num": "8658", "n": 12, "c": "Autopilot", "q": "A fully integrated autopilot controls the aircraft around how many axes?", "o": ["Two.", "Three.", "Four."], "a": 1, "e": "A fully integrated autopilot controls an airplane about all three of its axes; its roll axis, its pitch axis, and its yaw axis.", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8659", "s": "Communication & Navigation", "num": "8659", "n": 13, "c": "Autopilot", "q": "Dutch roll, a combination yawing and rolling oscillation that affects many sweptwing aircraft, is counteracted with", "o": ["a flight director system.", "an aileron damper system.", "a yaw damper system."], "a": 2, "e": "A yaw damper is installed in many swept wing airplanes to counteract Dutch roll.\nDutch roll is an undesirable, low-amplitude oscillation about both the yaw and roll axes. These oscillations are sensed by a rate gyro. Signals are sent to the rudder servo that provides the correct rudder movement to cancel these oscillations.", "r": "ASA Airframe Test Guide · (025) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8660", "s": "Communication & Navigation", "num": "8660", "n": 14, "c": "Autopilot", "q": "When operationally checking an autopilot system on the ground, after the aircraft's main power has been switched on, the autopilot should be engaged", "o": ["only after the gyros come up to speed and the amplifier warms up.", "whenever the operator desires.", "for only a few minutes at a time."], "a": 0, "e": "When operationally checking an autopilot system on the ground, the autopilot should not be engaged until the gyros are up to speed and the amplifier is properly warmed up.", "r": "ASA Airframe Test Guide · (026) AMT-SYS Ch 10", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8661", "s": "Communication & Navigation", "num": "8661", "n": 15, "c": "Radio, ELT & Komunikasi", "q": "Installed radio equipment is protected from damage due to jolts and vibration by", "o": ["shock mounts.", "spring and/or viscous damper mounted racks.", "rubber or foam cushioning material between circuit chassis and case."], "a": 0, "e": "Shock-mounted racks are used to protect radio equipment installed in an aircraft from vibration damage.", "r": "ASA Airframe Test Guide · (086) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8662", "s": "Communication & Navigation", "num": "8662", "n": 16, "c": "Radio, ELT & Komunikasi", "q": "(1) Use solder to attach bonding jumpers on radio equipment.\n(2) Radio equipment is bonded to the aircraft in order to provide a low-impedance ground and to minimize radio interference from static electrical charges.\nRegarding the above statements,", "o": ["only No. 1 is true.", "both No. 1 and No. 2 are true.", "only No. 2 is true."], "a": 2, "e": "Statement (1) is not true. AC 43.13-2A recommends that you avoid the use of solder when attaching bonding jumpers. Clamps and screws are preferred.\nStatement (2) is true. Radio equipment is bonded to the aircraft to provide a low-impedance ground and to minimize radio interference from static electrical charges.", "r": "ASA Airframe Test Guide · (086) AC 43.13-2", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8663", "s": "Communication & Navigation", "num": "8663", "n": 17, "c": "Radio, ELT & Komunikasi", "q": "When must the radio station license be displayed in an aircraft equipped with a two-way radio?", "o": ["When the aircraft is operated outside the U.S.", "When the aircraft is returned to service.", "When the aircraft is certified for IFR flight."], "a": 0, "e": "A radio station license issued by the Federal Communications Commission was formerly required to be displayed in all operating aircraft equipped with a two-way radio. A recent change in the FCC regulations requires this license to be in the aircraft only when it is operated outside the U.S.", "r": "ASA Airframe Test Guide · (087) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8664", "s": "Communication & Navigation", "num": "8664", "n": 18, "c": "Radio, ELT & Komunikasi", "q": "When would a U.S. resident NOT be required to hold a Federal Communications Commission (FCC) Restricted Radio Telephone Operator Permit to operate two-way aircraft VHF radio equipment?", "o": ["When flying to or communicating with destinations outside the United States.", "When flying or communicating within the United States.", "When the radio equipment is operated in aircraft certified for VFR flight only."], "a": 1, "e": "The FCC regulations require a restricted radio telephone operator permit only when the aircraft is operated outside the U.S.", "r": "ASA Airframe Test Guide · (087) §91.203", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8665", "s": "Communication & Navigation", "num": "8665", "n": 19, "c": "Radio, ELT & Komunikasi", "q": "Part of the ADF system used on aircraft includes", "o": ["RMI indicator antenna.", "marker beacon antenna.", "sense and loop antennas."], "a": 2, "e": "The Automatic Direction Finder (ADF) system operates in the low- and medium-frequency (LF/MF) band, and the airborne equipment consists of a receiver, a loop (directional) antenna, a sense (nondirectional) antenna, an indicator, and a control unit.", "r": "ASA Airframe Test Guide · (071) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8666", "s": "Communication & Navigation", "num": "8666", "n": 20, "c": "Radio, ELT & Komunikasi", "q": "When installing coaxial cable, it should be secured firmly along its entire length", "o": ["at 1-foot intervals.", "wherever the cable sags.", "at 2-foot intervals."], "a": 2, "e": "When installing a coaxial cable, secure the cable firmly along its entire length at intervals of approximately every two feet.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8667", "s": "Communication & Navigation", "num": "8667", "n": 21, "c": "Radio, ELT & Komunikasi", "q": "When must the emergency locator transmitter (ELT) battery be replaced (other than reading the replacement date)?", "o": ["When the transmitter has been in use for more than one cumulative hour.", "Must be replaced annually or if the five G switch has been activated.", "When the transmitter has been tested more than ten times."], "a": 0, "e": "According to 14 CFR §91.207, the batteries of an ELT must be replaced or recharged (if they are rechargeable):\n• by the date marked on the outside of the transmitter\n• when the transmitter has been in use for more than one cumulative hour\n• when 50% of their useful life has expired.", "r": "ASA Airframe Test Guide · (044) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8668", "s": "Communication & Navigation", "num": "8668", "n": 22, "c": "Radio, ELT & Komunikasi", "q": "An emergency locator transmitter (ELT) battery must be capable of furnishing power for signal transmission for at least", "o": ["36 hours.", "48 hours.", "72 hours."], "a": 1, "e": "When activated, the battery installed in an ELT must be capable of furnishing power for signal transmission for at least 48 hours.", "r": "ASA Airframe Test Guide · (044) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8669", "s": "Communication & Navigation", "num": "8669", "n": 23, "c": "Radio, ELT & Komunikasi", "q": "The preferred location of an ELT is", "o": ["where it is readily accessible to the pilot or a member of the flightcrew while the aircraft is in flight.", "as far aft as possible.", "as far aft as possible, but forward of the vertical fin."], "a": 2, "e": "An ELT must be installed in a location where it is least likely to be destroyed in a crash. This is normally as far aft as possible, but forward of the vertical fin.", "r": "ASA Airframe Test Guide · (086) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8670", "s": "Communication & Navigation", "num": "8670", "n": 24, "c": "Radio, ELT & Komunikasi", "q": "An emergency locator transmitter (ELT) is normally activated by an inertial switch or equivalent mechanism if subjected to a force of a prescribed intensity and duration. It must activate when the force is applied", "o": ["parallel to the longitudinal axis of the aircraft.", "parallel to the vertical axis of the aircraft.", "in any direction relative to the aircraft axes."], "a": 0, "e": "An ELT is activated by an inertial switch that senses impact forces primarily parallel to the longitudinal axis to the aircraft.", "r": "ASA Airframe Test Guide · (044) AC 91-44A", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8671", "s": "Communication & Navigation", "num": "8671", "n": 25, "c": "Radio, ELT & Komunikasi", "q": "How may the battery replacement date be verified for an emergency locator transmitter (ELT)?", "o": ["By removing the batteries and testing them under a measured load to determine if 50 percent of the useful life remains.", "By observing the battery replacement date marked on the outside of the transmitter.", "By activating the transmitter and measuring the signal strength."], "a": 1, "e": "According to 14 CFR §91.207, the batteries of an ELT must be replaced or recharged (if they are rechargeable):\n• by the date marked on the outside of the transmitter\n• when the transmitter has been in use for more than one cumulative hour\n• when 50% of their useful life has expired", "r": "ASA Airframe Test Guide · (044) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8672", "s": "Communication & Navigation", "num": "8672", "n": 26, "c": "Radio, ELT & Komunikasi", "q": "How may the operation of an installed emergency locator transmitter (ELT) be verified during aircraft inspection?", "o": ["By moving the deactivating switch from the DISARM position to the ARM position while monitoring the civil emergency frequency with a communications receiver at five minutes after the hour.", "By activating the 5 g switch and turning the unit on at five minutes after the hour.", "By tuning a communications receiver to the civil emergency frequency and activating the ELT momentarily within five minutes after the hour."], "a": 2, "e": "Operation of an ELT is verified by tuning a communications receiver to the emergency frequency of 121.5 or 406 MHz and activating the transmitter for no more than three audible sweeps. The test must be conducted within the first five minutes after any hour. If the ELT must be operated outside of this time frame, you should contact the control tower before conducting this test.", "r": "ASA Airframe Test Guide · (044) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8673", "s": "Communication & Navigation", "num": "8673", "n": 27, "c": "Radio, ELT & Komunikasi", "q": "Static dischargers help eliminate radio interference by dissipating static electricity into the atmosphere at", "o": ["low current levels.", "high voltage level.", "high current levels."], "a": 0, "e": "Static dischargers are mounted on the trailing edges of aircraft control surfaces to conduct charges of static electricity into the atmosphere before they build up enough voltage to cause a high current to flow and cause radio interference. By the proper design and location of these dischargers, the static charges will be dissipated while its current level is low.", "r": "ASA Airframe Test Guide · (071) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8675", "s": "Communication & Navigation", "num": "8675", "n": 28, "c": "Radio, ELT & Komunikasi", "q": "An aircraft antenna installation must be grounded", "o": ["to the airframe.", "to the engine.", "to the radio rack."], "a": 0, "e": "When an aircraft radio antenna installation is required to be grounded, it is grounded to the airframe structure.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8676", "s": "Communication & Navigation", "num": "8676", "n": 29, "c": "Radio, ELT & Komunikasi", "q": "VHF radio signals are commonly used in", "o": ["ATC communications.", "VOR navigation.", "both VOR navigation and ATC communications."], "a": 2, "e": "Very High Frequency (VHF) radio transmissions operate in the 118.000 to 135.975 megahertz range. This frequency range is used for air traffic control (ATC) communications and Very-high-frequency Omni Range (VOR) navigation.", "r": "ASA Airframe Test Guide · (071) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8677", "s": "Communication & Navigation", "num": "8677", "n": 30, "c": "Radio, ELT & Komunikasi", "q": "On modern large aircraft, what electronic device typically monitors flight parameters and performs autopilot functions?", "o": ["Flight management computer.", "Transponder.", "Control/display unit."], "a": 0, "e": "Large aircraft have many sophisticated electronic control devices. The Flight Management Computer (FMC) monitors flight parameters and performs autopilot functions. It regulates the movement of the control surface actuators which control the stabilizers, elevators, rudders, speed brakes, and spoilers.", "r": "ASA Airframe Test Guide · (071) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8678", "s": "Communication & Navigation", "num": "8678", "n": 31, "c": "Radio, ELT & Komunikasi", "q": "In the landing configuration GPWS typically monitors the radio (radar) altimeter; air data computer; instrument landing system; and", "o": ["aileron, rudder, and elevator positions.", "landing gear and flap positions.", "spoiler, slat, and stabilizer positions."], "a": 1, "e": "The Ground Proximity Warning System (GPWS) senses the nearness of the ground and warns the pilot if the aircraft has gotten too near the ground when it is not in a configuration for landing. It does this by monitoring the radar altimeter to determine the actual height above the ground.\nIt also monitors the air data computer, instrument landing system, and landing gear and flap position to determine if the aircraft is properly configured for its distance from the ground. If it is too near the ground for its location or configuration, the system will warn the pilot.", "r": "ASA Airframe Test Guide · (018) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8679", "s": "Communication & Navigation", "num": "8679", "n": 32, "c": "Antena & Navigasi", "q": "In general, the purpose of an aircraft transponder is to", "o": ["continually transmit heading, speed, and rate of climb/decent etc. information to ATC.", "monitor aircraft speed, heading, altitude, and attitude whenever the autopilot system is engaged.", "receive an interrogation signal from a ground station and automatically send a reply back."], "a": 2, "e": "An Air Traffic Control (ATC) transponder is a special radio transceiver that receives an interrogation signal from an ATC radar and automatically replies with a coded signal. The coded response to the ground station interrogation allows the controller to identify the aircraft.", "r": "ASA Airframe Test Guide · (071) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8680", "s": "Communication & Navigation", "num": "8680", "n": 33, "c": "Antena & Navigasi", "q": "When an antenna is installed, it should be fastened", "o": ["to the primary structure at the approximate intersection of the three aircraft axes.", "with a reinforcing doubler on each side of the aircraft skin.", "so that loads imposed are transmitted to the aircraft structure."], "a": 2, "e": "An antenna must be installed on an aircraft in such a way that the loads imposed are transmitted into the aircraft structure.", "r": "ASA Airframe Test Guide · (023) AC 43.13-2", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8681", "s": "Communication & Navigation", "num": "8681", "n": 34, "c": "Antena & Navigasi", "q": "After an automatic direction finding antenna has been installed, the", "o": ["antenna must be grounded.", "loop must be calibrated.", "transceiver must be compensated."], "a": 1, "e": "When an automatic direction finder is installed on a particular type of aircraft for the first time, it is important that the loop antenna be checked for quadrantal error.\nQuadrantal error is the error caused by the metal in the aircraft structure distorting the electromagnetic field of the received signal.\nQuadrantal error causes azimuth inaccuracies, which are greatest between the four cardinal points with respect to the center line of the aircraft.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8682", "s": "Communication & Navigation", "num": "8682", "n": 35, "c": "Antena & Navigasi", "q": "Doublers are used when antennas are installed to", "o": ["eliminate antenna vibration.", "prevent oil canning of the skin.", "reinstate the structural strength of the aircraft skin."], "a": 2, "e": "A doubler is used under an antenna when it is installed on an aircraft skin to replace the strength in the structure that was lost when the hole was cut for mounting the antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8683", "s": "Communication & Navigation", "num": "8683", "n": 36, "c": "Antena & Navigasi", "q": "One antenna can be used for the radio range and standard broadcast bands in light aircraft because the", "o": ["two ranges are close together.", "antenna is omnidirectional.", "antenna length may be electronically adjusted."], "a": 0, "e": "One antenna can be used on light aircraft to receive both the low-frequency radio range and the standard broadcast bands.\nThe frequency range of these two types of radio transmissions are so close together that one antenna can effectively receive both signals.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8684", "s": "Communication & Navigation", "num": "8684", "n": 37, "c": "Antena & Navigasi", "q": "What characteristics of the installation of a rigid antenna on a vertical stabilizer should be evaluated?", "o": ["Polarization and impedance.", "Impedance and interference.", "Flutter and vibration."], "a": 2, "e": "When any rigid antenna is mounted on a vertical stabilizer, the flutter and vibration characteristics must be carefully evaluated.\nAn antenna can change the resonant frequency of the vertical surface.", "r": "ASA Airframe Test Guide · (023) AC 43.13-2", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8685", "s": "Communication & Navigation", "num": "8685", "n": 38, "c": "Antena & Navigasi", "q": "A gasket or sealant is used between the antenna mast and fuselage skin", "o": ["to prevent the entry of moisture.", "for aircraft pressurization only.", "to prevent abrasion between the antenna mast and fuselage skin."], "a": 0, "e": "A gasket or sealant is used between a radio antenna mast and the fuselage skin to prevent the entry of moisture into the fuselage.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8686", "s": "Communication & Navigation", "num": "8686", "n": 39, "c": "Antena & Navigasi", "q": "The preferred location of a VOR antenna on light aircraft is on", "o": ["the bottom of the fuselage and as far forward as possible.", "top of the cabin with the apex of the V pointing forward.", "top of the vertical stabilizer."], "a": 1, "e": "The preferred location for a VOR antenna on a single-engine aircraft is on top of the cabin, with the apex of the V pointing forward.", "r": "ASA Airframe Test Guide · (023) AC 43.13-2", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8687", "s": "Communication & Navigation", "num": "8687", "n": 40, "c": "Antena & Navigasi", "q": "The purpose of a localizer is to", "o": ["set the airplane on the proper approach angle to the runway.", "indicate the distance the airplane is from the end of the runway.", "align the airplane with the center of the runway."], "a": 2, "e": "The function of a localizer in an Instrument Landing System (ILS) is to align the aircraft with the center line of the instrument runway.", "r": "ASA Airframe Test Guide · (085) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8688", "s": "Communication & Navigation", "num": "8688", "n": 41, "c": "Antena & Navigasi", "q": "(Refer to Figure 15.) What is the approximate drag load on an antenna with a frontal area of .125 square feet installed on an aircraft with a speed of 225 MPH?", "o": ["2.069 pounds.", "2.073 pounds.", "2.080 pounds."], "a": 0, "e": "This computation is described in AC 43.13-2A.\nThe constant 0.000327 is multiplied by the frontal area of the antenna (in this case, 0.125 square foot). This quantity is multiplied by the square of the never-exceed speed of the aircraft which is 225 MPH.\nD = 0.000327 × 0.125 × 225² = 2.069 pounds", "r": "ASA Airframe Test Guide · (023) AC 43.13-2", "y": 0, "qi": ["F15"], "kf": 1}, {"id": "CN-8689", "s": "Communication & Navigation", "num": "8689", "n": 42, "c": "Antena & Navigasi", "q": "(Refer to Figure 15.) What is the approximate drag load on an antenna with a frontal area of .137 square feet installed on an aircraft with a speed of 275 MPH?", "o": ["3.387 pounds.", "3.741 pounds.", "3.592 pounds."], "a": 0, "e": "This computation is described in AC 43.13-2A.\nThe constant 0.000327 is multiplied by the frontal area of the antenna (in this case, 0.137 square foot). This quantity is multiplied by the square of the never-exceed speed of the aircraft which is 275 MPH.\nD = 0.000327 × 0.137 × 275² = 3.3879 pounds", "r": "ASA Airframe Test Guide · (023) AC 43.13-2", "y": 0, "qi": ["F15"], "kf": 1}, {"id": "CN-8690", "s": "Communication & Navigation", "num": "8690", "n": 43, "c": "Antena & Navigasi", "q": "A DME antenna should be located in a position on the aircraft that will", "o": ["not be blanked by the wing when the aircraft is banked.", "permit interruptions in DME operation.", "eliminate the possibility of the DME locking on a station."], "a": 0, "e": "To prevent an interruption in DME operation, the antenna must be located in a position that will not be blanked by the wing when the aircraft is banked.", "r": "ASA Airframe Test Guide · (085) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8691", "s": "Communication & Navigation", "num": "8691", "n": 44, "c": "Antena & Navigasi", "q": "When bending coaxial cable, the bend radius should be at least", "o": ["10 times the diameter of the cable.", "15 times the diameter of the cable.", "20 times the diameter of the cable."], "a": 0, "e": "Because it is essential that the center conductor of a coaxial cable remain in its exact center, coax should not be bent with a radius of less than 10 times its diameter.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8692", "s": "Communication & Navigation", "num": "8692", "n": 45, "c": "Antena & Navigasi", "q": "When installing a DME antenna, it should be aligned with the", "o": ["null position.", "angle of incidence.", "centerline on the airplane."], "a": 2, "e": "A DME antenna should be mounted on the center line of the belly of an airplane.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8693", "s": "Communication & Navigation", "num": "8693", "n": 46, "c": "Antena & Navigasi", "q": "(Refer to Figure 16.) Which of the antennas shown is a typical DME antenna?", "o": ["1.", "2.", "4."], "a": 0, "e": "The antenna shown in 1 is a DME or a radar beacon transponder antenna.\nThe antenna shown in 2 is a glide slope antenna.\nThe antenna shown in 3 is a VOR and localizer antenna.\nThe antenna shown in 4 is a VHF communications antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F16"], "kf": 1}, {"id": "CN-8694", "s": "Communication & Navigation", "num": "8694", "n": 47, "c": "Antena & Navigasi", "q": "(Refer to Figure 16.) Which of the antennas shown is a typical glideslope antenna?", "o": ["2.", "3.", "4."], "a": 0, "e": "The antenna shown in 2 is a glide slope antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F16"], "kf": 1}, {"id": "CN-8694-1", "s": "Communication & Navigation", "num": "8694-1", "n": 48, "c": "Antena & Navigasi", "q": "(Refer to Figure 22.) What kind of antenna is this?", "o": ["This is a glide slope antenna.", "This is a DME or a radar beacon transponder.", "This is a loop and sense antenna."], "a": 2, "e": "The low-profile single antenna in Figure 22 is a loop and sense antenna, which is used for ADF navigation.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F22"], "kf": 1}, {"id": "CN-8694-2", "s": "Communication & Navigation", "num": "8694-2", "n": 49, "c": "Antena & Navigasi", "q": "(Refer to Figure 23.) What is this antenna used for?", "o": ["This is an altitude encoder used with transponders.", "This is a TCAS receiver used with monitoring and alerting systems.", "This is an aircraft radar beacon transponder used for location identification."], "a": 0, "e": "The ceiling-mounted box in Figure 23 depicts an altitude encoder used to convert the aircraft's pressure altitude into a code sent by the transponder to ATC.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F23"], "kf": 1}, {"id": "CN-8694-3", "s": "Communication & Navigation", "num": "8694-3", "n": 50, "c": "Antena & Navigasi", "q": "(Refer to Figure 24.) What kind of antenna is this?", "o": ["A dipole antenna.", "A Marconi antenna.", "A loop antenna."], "a": 0, "e": "Figure 24 depicts a V-shaped VOR navigation antenna, which is a common dipole antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F24"], "kf": 1}, {"id": "CN-8694-4", "s": "Communication & Navigation", "num": "8694-4", "n": 51, "c": "Antena & Navigasi", "q": "(Refer to Figure 25.) What kind of antenna is this?", "o": ["A dipole antenna.", "A canted antenna.", "A Marconi antenna."], "a": 1, "e": "Figure 25 depicts a canted antenna; many antennas are canted (or slanted) for better reception.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F25"], "kf": 1}, {"id": "CN-8694-5", "s": "Communication & Navigation", "num": "8694-5", "n": 52, "c": "Antena & Navigasi", "q": "(Refer to Figure 26.) Where is the strongest signal for this antenna?", "o": ["Below the antenna.", "Above the antenna.", "Ahead of the antenna."], "a": 1, "e": "The strongest signals come from, or are received at, 90-degrees to the length of the antenna. There is no field generated off of the end of the antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F26"], "kf": 1}, {"id": "CN-8694-6", "s": "Communication & Navigation", "num": "8694-6", "n": 53, "c": "Antena & Navigasi", "q": "(Refer to Figure 27.) What kind of antenna is this?", "o": ["A glide slope antenna.", "A VOR and localizer antenna.", "A radar beacon transponder antenna."], "a": 2, "e": "Figure 27 depicts an aircraft radar beacon transponder antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F27"], "kf": 1}, {"id": "CN-8694-7", "s": "Communication & Navigation", "num": "8694-7", "n": 54, "c": "Antena & Navigasi", "q": "(Refer to Figure 28.) What kind of antenna is this?", "o": ["An ELT antenna.", "A DME antenna.", "A VHF communications antenna."], "a": 0, "e": "Figure 28 depicts an emergency locator transponder (ELT) antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F28"], "kf": 1}, {"id": "CN-8694-8", "s": "Communication & Navigation", "num": "8694-8", "n": 55, "c": "Antena & Navigasi", "q": "(Refer to Figure 29.) What kind of antenna is this?", "o": ["A glide slope antenna.", "A VOR and localizer antenna.", "A radar beacon transponder antenna."], "a": 1, "e": "Figure 29 depicts a VOR and localizer antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F29"], "kf": 1}, {"id": "CN-8694-9", "s": "Communication & Navigation", "num": "8694-9", "n": 56, "c": "Antena & Navigasi", "q": "(Refer to Figure 30.) What kind of antenna is this?", "o": ["A lightning detector system antenna.", "A VOR and localizer antenna.", "A satellite weather antenna."], "a": 0, "e": "Figure 30 depicts a lightning detector system antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F30"], "kf": 1}, {"id": "CN-8694-10", "s": "Communication & Navigation", "num": "8694-10", "n": 57, "c": "Antena & Navigasi", "q": "(Refer to Figure 31.) What kind of antenna is this?", "o": ["A lightning detector system antenna.", "A marker beacon receiver antenna.", "A satellite weather antenna."], "a": 1, "e": "Figure 31 depicts a marker beacon receiver antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F31"], "kf": 1}, {"id": "CN-8694-11", "s": "Communication & Navigation", "num": "8694-11", "n": 58, "c": "Antena & Navigasi", "q": "(Refer to Figure 32.) What kind of antenna is this?", "o": ["A lightning detector system antenna.", "A marker beacon receiver antenna.", "A radar beacon transponder antenna."], "a": 2, "e": "Figure 32 depicts a radar beacon transponder antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F32"], "kf": 1}, {"id": "CN-8694-12", "s": "Communication & Navigation", "num": "8694-12", "n": 59, "c": "Antena & Navigasi", "q": "(Refer to Figure 33.) What kind of antenna is this?", "o": ["A VOR/glide slope antenna.", "A marker beacon receiver antenna.", "A radar beacon transponder antenna."], "a": 0, "e": "Figure 33 depicts a VOR/glide slope antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F33"], "kf": 1}, {"id": "CN-8694-13", "s": "Communication & Navigation", "num": "8694-13", "n": 60, "c": "Antena & Navigasi", "q": "(Refer to Figure 34.) What kind of antenna is this?", "o": ["A VOR/glide slope antenna.", "A marker beacon receiver antenna.", "A radar beacon transponder antenna."], "a": 0, "e": "Figure 34 depicts a VOR/glide slope antenna.", "r": "ASA Airframe Test Guide · (023) AMT-SYS Ch 11", "y": 0, "qi": ["F34"], "kf": 1}, {"id": "CN-8695", "s": "Communication & Navigation", "num": "8695", "n": 61, "c": "Antena & Navigasi", "q": "The addition of avionics and associated antenna systems forward of the CG limit will affect", "o": ["empty weight and useful load.", "CG limits and useful load.", "useful load and maximum gross weight."], "a": 0, "e": "The installation of avionics equipment and its associated antenna, ahead of the CG limit, will affect the empty weight of the aircraft, its CG, and its useful load.\nWhen such equipment is installed, a new weight and balance record must be made showing the change in the empty weight and empty-weight CG of the aircraft. The addition of avionics equipment will decrease the useful load of the aircraft.", "r": "ASA Airframe Test Guide · (028) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8696", "s": "Communication & Navigation", "num": "8696", "n": 62, "c": "Antena & Navigasi", "q": "How much clearance from the seat bottom is required when installing radio equipment under a seat?", "o": ["3 inches with the seat unoccupied.", "No set minimum as long as the equipment receives adequate cooling and damage protection.", "1 inch with the seat occupied and subjected to maximum downward seat spring deflection."], "a": 2, "e": "When installing radio equipment under an aircraft seat, there must be one inch of clearance between the equipment and the bottom of the seat when it is occupied and subjected to a downward force of 1,122 pounds. This load is found by multiplying the 170-pound nominal weight of an occupant by a load factor of 6.6.", "r": "ASA Airframe Test Guide · (028) AC 43.13-2", "y": 0, "qi": [], "kf": 1}, {"id": "CN-8697", "s": "Communication & Navigation", "num": "8697", "n": 63, "c": "Antena & Navigasi", "q": "The purpose of a glideslope system is to", "o": ["provide for automatic altitude reporting to air traffic control.", "indicate the distance the airplane is from the end of the runway.", "assist the pilot in making a correct angle of descent to the runway."], "a": 2, "e": "The glide slope system is the part of an Instrument Landing System (ILS) that allows a pilot to make the correct angle of descent to the instrument runway during an approach.", "r": "ASA Airframe Test Guide · (028) AMT-SYS Ch 11", "y": 0, "qi": [], "kf": 1}], "imgs": {"logo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAQDAwQDAwQEBAQFBQQFBwsHBwYGBw4KCggLEA4RERAOEA8SFBoWEhMYEw8QFh8XGBsbHR0dERYgIh8cIhocHRz/2wBDAQUFBQcGBw0HBw0cEhASHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBz/wAARCAJDA+gDASIAAhEBAxEB/8QAHQABAAICAwEBAAAAAAAAAAAAAAcIBgkDBAUCAf/EAG4QAAECBQEEBAcICQwMCwcDBQECAwAEBQYRBwgSITETQVFhFCIycYGRoRUjQlJysdHSFhhigpKUsrPBCRckM0NFVXWVosLTJTU3RlNWY2VzdIOEJic0REdkk6O0w+E2VFeFxPDxKDjiGWZ2hqT/xAAcAQEAAgMBAQEAAAAAAAAAAAAAAwQBAgUGBwj/xABMEQABAwIDBAUJBAgFAgYCAwABAAIDBBEFITEGEkFRE2FxkaEUIjJCUoGxwdEHFeHwIyQzQ0RTYpIWcoKisibCFyU0NWPxRdJUk+L/2gAMAwEAAhEDEQA/AL/QhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhCCJCEIIkIQgiQhH4YIo3nNftN5CbmJSZuuTbmJdxTTiChzKVpOCPJ6iDHENojTE/wB98j+A59WKA3t/7b3L/GUz+dVHoUTTG77jpyKjSLbqU9IuEhL8u1vIJBwcHuMedOLzl5YxgNu1fYx9neFMpo6ipqiwOA1LQLkXtmFsLt/VeybqmUy1IuemTUyryWQ+EuK8yVYJjMY1SVOkTtFnlylQlH5OdZPjNPtlC0Hz const ss=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const BY=Object.fromEntries(BANK.map(q=>[q.id,q])),SETS=[...new Set(BANK.map(q=>q.s))],ALL=D.all||'',NY=0,CHS=()=>[...new Set(BANK.filter(inSet).map(q=>q.c).filter(Boolean))];
const F={s:SETS[0],ch:new Set(),y:false,k:'',rg:'',n:20,ord:'acak'};const inSet=q=>F.s==='*'||q.s===F.s;let S=null;
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fig=k=>`<div class="fig"><img alt="gambar" src="${IM[k]}"></div>`;
const figs=l=>(l||[]).map(fig).join('');
const rich=s=>(s||'').split('\n').map(p=>{const m=p.match(/^\[\[IMG:(f\d+)\]\]$/);return m?fig(m[1]):`<p>${esc(p)}</p>`}).join('');
const parseRg=s=>{const r=[];(s||'').replace(/\s*-\s*/g,'-').split(/[,;\s]+/).forEach(x=>{const m=x.match(/^(\d+)(?:-(\d+))?$/);if(m){const a=+m[1],b=m[2]?+m[2]:a;r.push([Math.min(a,b),Math.max(a,b)])}});return r};
const inRg=(q,r)=>!r.length||r.some(([a,b])=>q.n>=a&&q.n<=b);
const match=q=>inSet(q)&&(!F.ch.size||F.ch.has(q.c))&&(!F.y||q.y)&&(!F.k||(q.q+' '+q.o.join(' ')).toLowerCase().includes(F.k.toLowerCase()));
const pool=()=>{const r=parseRg(F.rg);return BANK.filter(q=>match(q)&&inRg(q,r))};
const tog=(s,v)=>s.has(v)?s.delete(v):s.add(v);
const chips=(arr,set,attr,lab)=>arr.map(v=>`<button class="chip ${set.has(v)?'on':''}" data-${attr}="${esc(v)}">${lab(v)}</button>`).join('');
function home(){
  const wr=sg('cn_wrong',[]).filter(id=>BY[id]),sess=sg('cn_sess',null),hist=sg('cn_hist',[]);
  app.innerHTML=`<div class="hero"><img src="${IM.logo}" alt="Basic Aircraft Maintenance C Batch 3, Lion Group Training Center"></div><h1>Latihan Soal AMT Airframe: Communication &amp; Navigation</h1><div class="mu">${BANK.length} soal pilihan ganda (Autopilot · Radio &amp; ELT · Antena &amp; Navigasi) · jawaban langsung diperiksa + pembahasan</div>
  <div class="card">${SETS.length>1?`<h2>Pilih materi</h2><div class="row">${SETS.map(s=>`<button class="chip ${F.s===s?'on':''}" data-s="${esc(s)}">${esc(s)} <small>${BANK.filter(q=>q.s===s).length}</small></button>`).join('')}${ALL?`<button class="chip ${F.s==='*'?'on':''}" data-s="*">${esc(ALL)} <small>${BANK.length}</small></button>`:''}</div>`:''}${CHS().length>1?`<h2>Bab</h2><div class="row"><button class="chip ${F.ch.size?'':'on'}" data-c="*">Semua bab</button>${chips(CHS(),F.ch,'c',v=>esc(v)+' <small>'+BANK.filter(q=>q.c===v).length+'</small>')}</div>`:''}
  <h2>Nomor urut soal</h2><input type="text" id="rg" placeholder="mis. 1-50 atau 1-20, 45, 60-80" value="${esc(F.rg)}"><div class="mu" style="margin-top:6px">Kosongkan untuk semua. Nomor 1–${BANK.filter(inSet).length} mengikuti urutan soal di dokumen.</div>
  <h2>Cari kata kunci</h2><input type="search" id="k" placeholder="mis. voltmeter, rivet, torque" value="${esc(F.k)}">
  <h2>Jumlah dan urutan</h2><div class="row">${[10,20,50,0].map(n=>`<button class="chip ${F.n===n?'on':''}" data-n="${n}">${n||'Semua'}</button>`).join('')}<input type="number" id="nn" class="chip" min="1" inputmode="numeric" placeholder="Jumlah sendiri" style="width:150px;text-align:left" value="${[10,20,50,0].includes(F.n)?'':F.n}"><button class="chip ${F.ord==='acak'?'on':''}" data-o="acak">Acak</button><button class="chip ${F.ord==='urut'?'on':''}" data-o="urut">Berurutan</button></div>
  <div style="margin-top:12px">Soal yang cocok: <span class="cnt" id="cnt"></span> · akan dikerjakan: <span class="cnt" id="take"></span></div>
  <button class="btn" id="go">Mulai latihan</button></div>
  ${wr.length?`<div class="card"><h2>Soal yang pernah salah</h2><div class="mu">${wr.length} soal tersimpan di perangkat ini. Filter di atas ikut berlaku.</div><button class="btn sec" id="rw">Kerjakan soal yang salah saja</button></div>`:''}
  ${sess&&sess.ids.some(i=>!(i in sess.ans))?`<div class="card"><h2>Sesi terakhir</h2><div class="mu">${Object.keys(sess.ans).length} dari ${sess.ids.length} soal sudah dijawab.</div><button class="btn sec" id="rs">Lanjutkan sesi</button></div>`:''}
  ${hist.length?`<div class="card"><h2>Riwayat</h2>${hist.slice(0,5).map(h=>`<div class="rev">${h.s}/${h.t} benar · ${h.l} · ${h.d}</div>`).join('')}</div>`:''}`;
  $$('[data-c]').forEach(e=>e.onclick=()=>{e.dataset.c==='*'?F.ch.clear():tog(F.ch,e.dataset.c);home()});
  $$('[data-s]').forEach(e=>e.onclick=()=>{F.s=e.dataset.s;F.ch.clear();F.rg='';home()});
  $$('[data-n]').forEach(e=>e.onclick=()=>{F.n=+e.dataset.n;home()});
  $$('[data-o]').forEach(e=>e.onclick=()=>{F.ord=e.dataset.o;home()});
  const upd=()=>{const a=pool().length;$('#cnt').textContent=a;$('#take').textContent=F.n?Math.min(F.n,a):a};upd();
  $('#k').oninput=e=>{F.k=e.target.value.trim();upd()};
  $('#rg').oninput=e=>{F.rg=e.target.value;upd()};
  $('#nn').oninput=e=>{const v=parseInt(e.target.value,10);F.n=v>0?v:20;$$('[data-n]').forEach(x=>x.classList.remove('on'));upd()};
  $('#go').onclick=()=>{let p=pool();if(!p.length)return alert('Tidak ada soal yang cocok dengan pilihanmu.');p=F.ord==='acak'?shuf(p):p.slice().sort((x,y)=>x.n-y.n);if(F.n)p=p.slice(0,F.n);start(p.map(q=>q.id),F.s==='*'?ALL:F.s)};
  const rw=$('#rw');if(rw)rw.onclick=()=>{const w=new Set(wr);let p=BANK.filter(q=>w.has(q.id)&&match(q));if(!p.length)return alert('Belum ada soal salah pada pilihan ini.');start(shuf(p).map(q=>q.id),'Soal salah')};
  const rs=$('#rs');if(rs)rs.onclick=()=>{S=sess;S.i=Math.max(0,S.ids.findIndex(i=>!(i in S.ans)));show()};
}
function start(ids,label){S={ids,ans:{},i:0,label};save();show()}
const save=()=>ss('cn_sess',S);
const st=id=>{const q=BY[id],a=S.ans[id];return a===undefined?'':a===q.a?'ok':'no'};
const exBox=q=>`<div class="ex"><b>Pembahasan</b>${q.e?rich(q.e):'<p class="mu">Dokumen tidak memuat penjelasan untuk soal ini.</p>'}${q.kf>=2?`<div class="mu"><b>Catatan kunci:</b> berkas sumber tidak memuat kunci jawaban; jawaban ini disusun Claude${q.kf===3?' dan kurang pasti':''}. Mohon verifikasi ke instruktur.</div>`:''}${q.r?`<div class="mu">Referensi: ${esc(q.r)}</div>`:''}</div>`;
function optHtml(q,k,pk){let c='';if(pk!==undefined){if(k===q.a)c='ok';else if(k===pk)c='no'}
  return `<button class="opt ${c}" data-k="${k}" ${pk!==undefined?'disabled':''}><b>${'ABC'[k]}</b><span style="flex:1">${esc(q.o[k])}</span></button>`}
function show(){
  const id=S.ids[S.i],q=BY[id],t=S.ids.length,pk=S.ans[id];
  const nb=S.ids.filter(i=>st(i)==='ok').length,ns=S.ids.filter(i=>st(i)==='no').length;
  app.innerHTML=`<div class="top"><button class="chip" id="x">Keluar</button><span>Benar ${nb} · Salah ${ns} · ${Object.keys(S.ans).length}/${t} dijawab</span></div>
  <div class="bar"><i style="width:${Object.keys(S.ans).length/t*100}%"></i></div>
  <div class="card"><span class="tag">Soal ${S.i+1} dari ${t}</span><span class="tag">${esc(q.s)} · No. ${q.num}</span>${q.c?`<span class="tag">${esc(q.c)}</span>`:''}${q.kf===1?'<span class="tag">kunci dari bank soal</span>':''}${q.kf===2?'<span class="tag mk">kunci disusun Claude</span>':''}${q.kf===3?'<span class="tag mk">kunci kurang pasti</span>':''}${q.y?'<span class="tag mk">★ bertanda kuning</span>':''}
  <div class="q">${esc(q.q)}</div>${figs(q.qi)}
  ${[0,1,2].map(k=>optHtml(q,k,pk)).join('')}
  ${pk!==undefined?exBox(q):''}
  <div class="nav"><button class="btn sec" id="pv" ${S.i===0?'disabled':''}>◀ Sebelumnya</button><button class="btn" id="nx">${S.i+1<t?'Berikutnya ▶':'Selesai'}</button></div></div>
  <div class="card"><h2>Lompat ke soal</h2><div class="leg"><span><i style="background:var(--ok)"></i>benar</span><span><i style="background:var(--no)"></i>salah</span><span><i></i>belum</span></div>
  <div class="grid">${S.ids.map((x,i)=>`<button class="g ${st(x)} ${i===S.i?'cur':''}" data-j="${i}">${i+1}</button>`).join('')}</div>
  <button class="btn sec" id="fin">Selesaikan latihan</button></div>`;
  $('#x').onclick=()=>{if(confirm('Keluar? Progres tersimpan dan bisa dilanjutkan dari beranda.'))home()};
  $$('.opt').forEach(e=>e.onclick=()=>{const v=+e.dataset.k;S.ans[id]=v;let w=sg('cn_wrong',[]);if(v===q.a)w=w.filter(x=>x!==id);else if(!w.includes(id))w.push(id);ss('cn_wrong',w);save();const y=scrollY;show();scrollTo(0,y)});
  $('#pv').onclick=()=>{S.i--;save();show();scrollTo(0,0)};
  $('#nx').onclick=()=>{if(S.i+1<t){S.i++;save();show();scrollTo(0,0)}else finish()};
  $$('[data-j]').forEach(e=>e.onclick=()=>{S.i=+e.dataset.j;save();show();scrollTo(0,0)});
  $('#fin').onclick=()=>{const left=t-Object.keys(S.ans).length;if(!left||confirm(left+' soal belum dijawab. Selesaikan sekarang?'))finish()};
}
function finish(){
  const t=S.ids.length,ok=S.ids.filter(i=>st(i)==='ok'),no=S.ids.filter(i=>st(i)==='no'),sc=ok.length+no.length,p=sc?Math.round(ok.length/sc*100):0;
  const h=sg('cn_hist',[]);h.unshift({s:ok.length,t:sc,l:S.label,d:new Date().toLocaleDateString('id-ID')});ss('cn_hist',h.slice(0,20));
  const w=S.ids.filter(i=>st(i)==='no');
  app.innerHTML=`<h1 style="text-align:center">Hasil latihan</h1><div class="card"><div class="score">${p}%</div>
  <div class="stat"><span style="color:var(--ok)">Benar ${ok.length}</span><span style="color:var(--no)">Salah ${no.length}</span><span class="mu">Belum dijawab ${S.ids.filter(i=>st(i)==='').length}</span></div>
  ${w.length?'<button class="btn" id="rw">Kerjakan soal yang salah saja ('+w.length+')</button>':''}
  <button class="btn sec" id="rv">Kembali ke soal ini</button><button class="btn sec" id="hm">Beranda</button></div>
  ${w.length?`<div class="card"><h2>Pembahasan jawaban salah</h2>${w.map(i=>{const q=BY[i],a=S.ans[i];return `<div class="rev"><b>${esc(q.q)}</b>${figs(q.qi)}<div style="color:var(--no);margin-top:6px">Jawabanmu: ${'ABC'[a]}. ${esc(q.o[a])}</div><div style="color:var(--ok)">Yang benar: ${'ABC'[q.a]}. ${esc(q.o[q.a])}</div>${exBox(q)}</div>`}).join('')}</div>`:''}`;
  const rw=$('#rw');if(rw)rw.onclick=()=>start(shuf(w),'Soal salah');
  $('#rv').onclick=()=>{S.i=0;show();scrollTo(0,0)};$('#hm').onclick=home;scrollTo(0,0);
}
home();
</script></body></html>
